name: Daily RSVP invitation check

on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsvp-e2e
  cancel-in-progress: true

jobs:
  invitation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the test invitation
        env:
          E2E_TEST_SITE_URL: ${{ vars.E2E_TEST_SITE_URL }}
          E2E_RSVP_TEST_TOKEN: ${{ secrets.E2E_RSVP_TEST_TOKEN }}
        run: npm run test:e2e
