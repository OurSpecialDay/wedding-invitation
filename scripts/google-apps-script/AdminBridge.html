<!doctype html>
<html><head><base target="_top"></head><body>
<script>
  (function () {
    var channel = 'wedding-rsvp-admin-bridge';
    var allowedParent = '<?= allowedParentOrigin ?>';
    var bridgeNonce = '<?= bridgeNonce ?>';
    if (!allowedParent || !bridgeNonce || window.top === window) return;
    var parentWindow = window.top;
    parentWindow.postMessage({ channel: channel, type: 'ready', nonce: bridgeNonce }, allowedParent);
    window.addEventListener('message', function (event) {
      if (event.source !== parentWindow || event.origin !== allowedParent) return;
      var message = event.data;
      if (!message || message.channel !== channel || message.type !== 'request' || message.nonce !== bridgeNonce || typeof message.id !== 'string') return;
      if (message.method === 'getAuthorizationUrl') {
        google.script.run.withSuccessHandler(function (url) {
          parentWindow.postMessage({ channel: channel, type: 'response', nonce: bridgeNonce, id: message.id, ok: true, result: url || '' }, allowedParent);
        }).withFailureHandler(function () {
          parentWindow.postMessage({ channel: channel, type: 'response', nonce: bridgeNonce, id: message.id, ok: false, errorCode: 'authorization_unavailable' }, allowedParent);
        }).rsvpAdminGetAuthorizationUrl();
      } else if (message.method === 'getAdminData') {
        google.script.run.withSuccessHandler(function (result) {
          parentWindow.postMessage({ channel: channel, type: 'response', nonce: bridgeNonce, id: message.id, ok: true, result: result }, allowedParent);
        }).withFailureHandler(function (error) {
          var messageText = String(error && error.message || '');
          if (/userinfo\.email|authorization required|required permissions/i.test(messageText)) {
            parentWindow.postMessage({ channel: channel, type: 'response', nonce: bridgeNonce, id: message.id, ok: false, errorCode: 'authorization_required' }, allowedParent);
          } else if (messageText.indexOf('ADMIN_IDENTITY_UNAVAILABLE') >= 0) {
            parentWindow.postMessage({ channel: channel, type: 'response', nonce: bridgeNonce, id: message.id, ok: false, errorCode: 'identity_unavailable' }, allowedParent);
          } else if (messageText.indexOf('ADMIN_ACCOUNT_NOT_ALLOWED') >= 0) {
            parentWindow.postMessage({ channel: channel, type: 'response', nonce: bridgeNonce, id: message.id, ok: false, errorCode: 'not_allowed' }, allowedParent);
          } else {
            parentWindow.postMessage({ channel: channel, type: 'response', nonce: bridgeNonce, id: message.id, ok: false, errorCode: 'backend' }, allowedParent);
          }
        }).rsvpAdminGetConsoleData();
      }
    });
  }());
</script></body></html>
