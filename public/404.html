<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opening invitation…</title></head>
  <body><script>
    (function () {
      var parts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
      var base = parts[0] ? '/' + parts[0] + '/' : '/';
      var route = parts.slice(1).join('/');
      if (route === 'admin') {
        window.location.replace(base + 'admin/');
      } else if (/^rsvp\/[A-Za-z0-9_-]{32}$/.test(route)) {
        window.location.replace(base + '?__ghPagesRoute=' + encodeURIComponent(route));
      } else {
        window.location.replace(base);
      }
    }());
  </script></body>
</html>
